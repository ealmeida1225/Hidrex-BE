[project]
name = "hidrex-be"
version = "0.1.0"
description = "Backend de Hidrex (Django)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "celery[redis]",
    "async-timeout",
    "django",
    "django-environ==0.11.2",
    "django-filter",
    "django-oauth-toolkit",
    "django-session-timeout==0.1.0",
    "djangorestframework",
    "django-solo==2.3.0",
    "django-safedelete==1.4.0",
    "django_extensions==3.2.3",
    "drf-extensions==0.7.1",
    "drf-spectacular==0.27.2",
    "drf-spectacular-sidecar==2024.7.1",
    "drf-orjson-renderer==1.7.3",
    "django-debug-toolbar",
    "Faker==28.4.1",
    "model-bakery",
    "numpy",
    "pillow==10.4.0",
    "pandas",
    "pytest-django",
    "ruff",
    "termcolor==2.4.0",
    "wheel",
]

[project.optional-dependencies]
deploy = [
    "gunicorn",
    "psycopg2-binary",
]

[tool.uv]
package = false
